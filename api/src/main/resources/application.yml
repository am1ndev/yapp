spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  ai:
    ollama:
      chat:
        options:
          model: mistral:7b-instruct
          temperature: 0.6
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

app:
  frontend:
    origin: ${WEB_URL}
  security:
    jwt:
      issuer: ${JWT_ISSUER:self}
      expiration-minutes: ${ACCESS_EXP:15}
      private: ${JWT_PRIVATE}
      public: ${JWT_PUBLIC}
    refresh:
      expiration-days: ${REFRESH_EXP:30}
